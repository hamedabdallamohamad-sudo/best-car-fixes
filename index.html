<style>

.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0002}

#store,#videos{background:#fff}
.btn,button{transition:filter .15s,transform .15s}.btn:hover,button:hover{filter:brightness(1.1)}
.hero{position:relative;overflow:hidden;padding-block:120px 110px}

.card{box-shadow:0 1px 3px #12263a1a;border-radius:6px}

.promo{grid-template-columns:1fr}

}
.svc{background:#fff;border:1px solid var(--l);border-inline-start:5px solid var(--o);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s}

.svc .ico{width:52px;height:52px;background:var(--n);color:#fff;display:grid;place-items:center;font-size:22px;border-radius:4px}
.svc h3{color:var(--n);font-size:19px;line-height:1.2}.svc p{color:var(--m);font-size:14px;flex:1}.svc button{align-self:flex-start}
.tiles a i{color:var(--o);font-size:22px}.contact a i,.fg a i{margin-inline-end:8px;color:var(--o)}.fg a i{color:#e8431a}
.im i{font-size:inherit}.fg .soc a i{margin:0;color:#fff}.soc a i{color:inherit}

.qty{flex-wrap:wrap}.step{display:flex}
.step .qb{background:var(--n);padding:8px 14px;border-radius:4px 0 0 4px}.step .qb:last-child{border-radius:0 4px 4px 0}
[dir=rtl] .step .qb{border-radius:0 4px 4px 0}[dir=rtl] .step .qb:last-child{border-radius:4px 0 0 4px}
.step input{width:52px;text-align:center;border-radius:0;padding:8px 0}.qty>button{flex:1 1 110px}
.im{position:relative}.bd{position:absolute;bottom:8px;inset-inline-start:8px;background:#12263acc;color:#fff;font:600 13px Cairo,sans-serif;padding:3px 10px;border-radius:12px}
.gt{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto}.gt button{flex:0 0 64px;height:64px;padding:0;background:#dfe5ea center/cover;border:2px solid var(--l);border-radius:4px}.gt button:hover{border-color:var(--o)}
.vids{display:grid;gap:10px;margin:6px 0}.vt,.vids iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px;background:#000 center/cover;color:#fff;font-size:36px;padding:0}
.fm{display:grid;grid-template-columns:1fr;gap:12px;padding:22px;max-width:none}.fm h2{margin-bottom:0}.fm a{color:var(--o)}
.stt{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;background:#e3e8ec}.st-processing{background:#ffe7b3}.st-ready{background:#cfe8ff}.st-done{background:#c8f0d2}
.hrow{border-bottom:1px solid var(--l);padding:8px 0;font-size:14px}

</style>
</head>

const authForm=m=>{$("#mc").innerHTML=`<form id="af" class="fm" data-m="${m}"><h2>${tr(m=="reg"?"acc_reg":"acc_login")}</h2>${m=="reg"?`<label><span>${tr("name")}</span><input name="name" required></label>`:""}<label><span>${tr("email")}</span><input name="email" type="email" required autocomplete="email"></label><label><span>${tr("pw")}</span><input name="pw" type="password" minlength="6" required autocomplete="${m=="reg"?"new-password":"current-password"}"></label><button>${tr(m=="reg"?"acc_reg":"acc_login")}</button><small id="aerr" style="color:#b3261e"></small><p><a href="#" data-am="${m=="reg"?"login":"reg"}">${tr(m=="reg"?"haveacc":"noacc")}</a>${m=="reg"?"":` · <a href="#" data-am="forgot">${tr("forgot")}</a>`}</p></form>`;$("#md").hidden=false};
const showAcc=async()=>{
  $("#mc").innerHTML=`<div class="fm"><h2>${esc(PF.name||U.displayName||U.email)}</h2><small>${esc(U.email)}</small><form id="pf" class="fm" style="padding:0"><label><span>${tr("name")}</span><input name="name" value="${esc(PF.name||U.displayName||"")}"></label><label><span>${tr("phone")}</span><input name="phone" type="tel" value="${esc(PF.phone||"")}"></label><label><span>${tr("addr")}</span><input name="address" value="${esc(PF.address||"")}"></label><button>${tr("save")}</button></form><div id="hist"></div><button id="lo" style="background:var(--n)">${tr("acc_out")}</button></div>`;
  $("#md").hidden=false;
  const rows=async c=>{try{return(await getDocs(query(collection(db,c),where("uid","==",U.uid)))).docs.map(d=>d.data()).sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0))}catch(e){return[]}};
  const [o,b,r]=await Promise.all([rows("orders"),rows("appointments"),rows("partRequests")]);
  if(!U||$("#md").hidden)return;
  const st=x=>`<span class="stt st-${x||"new"}">${tr("st_"+(x||"new"))}</span>`,dt=x=>x.createdAt&&x.createdAt.seconds?new Date(x.createdAt.seconds*1000).toLocaleDateString(lang=="ar"?"ar":"en"):"";
  const sec=(t,l)=>`<h3 style="margin-top:12px">${tr(t)}</h3>${l.length?l.join(""):`<p>${tr("none")}</p>`}`;
  $("#hist").innerHTML=sec("myorders",o.map(x=>`<div class="hrow"><b>${dt(x)}</b> ${st(x.status)}<br>${(x.items||[]).map(i=>esc(pk(i,"name"))+" ×"+i.qty).join("، ")} — $${Number(x.total||0).toFixed(2)}</div>`))
   +sec("mybook",b.map(x=>`<div class="hrow"><b>${esc(x.date)} ${esc(x.time||"")}</b> ${st(x.status)}<br>${esc(x.service)} — ${esc(x.car)}</div>`))
   +sec("myparts",r.map(x=>`<div class="hrow"><b>${dt(x)}</b> ${st(x.status)}<br>${esc(x.part)}</div>`))};
onAuthStateChanged(auth,async u=>{U=u;PF={};if(u){try{PF=(await getDoc(doc(db,"users",u.uid))).data()||{}}catch(e){}}render();prefill()});
$("#acc").onclick=()=>U?showAcc():authForm("login");
document.addEventListener("click",async e=>{
  const am=e.target.closest("[data-am]");
  if(am){e.preventDefault();if(am.dataset.am!="forgot")return authForm(am.dataset.am);
    const m=$("#af input[name=email]").value;if(!m){$("#aerr").textContent=tr("needmail");return}
    try{await sendPasswordResetEmail(auth,m);$("#aerr").style.color="#0a7a2f";$("#aerr").textContent=tr("resetsent")}catch(x){$("#aerr").textContent=aerr(x.code||"")}}
  if(e.target.closest("#lo")){await signOut(auth);$("#md").hidden=true}});
document.addEventListener("submit",async e=>{const f=e.target;
  if(f.id=="af"){e.preventDefault();const d=Object.fromEntries(new FormData(f)),reg=f.dataset.m=="reg";
    try{if(reg){const c=await createUserWithEmailAndPassword(auth,d.email,d.pw);await updateProfile(c.user,{displayName:d.name});PF={name:d.name,phone:"",address:""};try{await setDoc(doc(db,"users",c.user.uid),PF)}catch(x){}}
      else await signInWithEmailAndPassword(auth,d.email,d.pw);
      $("#md").hidden=true;toast(tr("welcome"))}catch(x){$("#aerr").textContent=aerr(x.code||"")}}
  if(f.id=="pf"){e.preventDefault();const d=Object.fromEntries(new FormData(f));PF={name:d.name,phone:d.phone,address:d.address};
    try{await setDoc(doc(db,"users",U.uid),PF);toast(tr("saved"));render();prefill()}catch(x){toast(x.code||"error")}}});
$("#cartbtn").onclick=()=>$("#cart").classList.add("open");
$("#cx").onclick=()=>$("#cart").classList.remove("open");
$("#lang").onclick=()=>{lang=lang=="ar"?"en":"ar";localStorage.lang=lang;render()};
$("#co").onclick=async()=>{
  if(API&&cart.length&&await post("/api/orders",{name:$("#cn").value,phone:$("#cp").value,address:$("#ca").value,items:cart.map(c=>({id:c.id,qty:c.qty}))})){cart=[];drawCart();$("#cart").classList.remove("open");return toast(tr("done"))}
  if(!cart.length)return toast(tr("empty"));
  if(!num("whatsappOrders"))return toast(tr("nowa"));
  const total=cart.reduce((a,c)=>a+c.qty*c.price,0),o={name:$("#cn").value,phone:$("#cp").value,address:$("#ca").value,items:cart,total,status:"new",createdAt:serverTimestamp()};
  save("orders",{...o,...(U?{uid:U.uid}:{})});
  openWA(`New order / طلب جديد\n${cart.map(c=>`• ${c.name} × ${c.qty} = $${(c.qty*c.price).toFixed(2)}`).join("\n")}\nTotal: $${total.toFixed(2)}\n${o.name} | ${o.phone}\n${o.address}`,"whatsappOrders");
  cart=[];drawCart();$("#cart").classList.remove("open");
};
$("#bf").onsubmit=async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  if(API&&await post("/api/bookings",f)){$("#bf").reset();prefill();return toast(tr("done"))}
  save("appointments",{...f,status:"new",createdAt:serverTimestamp(),...(U?{uid:U.uid}:{})});
  openWA(`Booking / حجز موعد\n${f.name} | ${f.phone}\n${f.car} (${f.year})\n${f.service}\n${f.date} ${f.time} | ${f.location}\n${f.notes}`,"whatsappBookings");
  e.target.reset();toast(tr("done"));
};
const slots=d=>{const h=S.hours?S.hours[new Date(d+"T00:00").getDay()]:{o:"09:00",c:"18:00"};if(!h||h.x||!h.o||!h.c)return[];const r=[];for(let t=+h.o.slice(0,2);t<+h.c.slice(0,2);t++)r.push(String(t).padStart(2,"0")+":00");return r};
$("#bf").elements.date.onchange=e=>{const s=slots(e.target.value);$("#bt").innerHTML=s.map(x=>`<option>${x}</option>`).join("");if(!s.length){toast(tr("closedday"));e.target.value=""}};
let rimg="";
$("#rf").elements.image.onchange=async e=>{rimg=e.target.files[0]?await toData(e.target.files[0],800):""};
$("#rf").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));delete f.image;
  save("partRequests",{...f,image:rimg,status:"new",createdAt:serverTimestamp(),...(U?{uid:U.uid}:{})});
  openWA(`Part request / طلب قطعة\n${f.name} | ${f.phone}\n${f.car} (${f.year})\n${f.part}`,"whatsappOrders");
  e.target.reset();rimg="";prefill();toast(tr("reqdone"))};
render();
// تحديث مباشر: أي تغيير من لوحة التحكم يظهر فوراً دون إعادة تحميل الصفحة
const live=(n,set)=>onSnapshot(collection(db,n),q=>{set(q.docs.map(d=>({id:d.id,...d.data()})));render()},e=>console.error("Firestore:",n,e.code||e));
live("services",v=>SV=v);live("products",v=>PR=v);live("categories",v=>CT=v);live("banners",v=>BN=v);live("videos",v=>VD=v);
onSnapshot(doc(db,"settings","site"),d=>{S=d.data()||{};render()},e=>console.error("Firestore: settings",e.code||e));
</script>
</body>
</html>
