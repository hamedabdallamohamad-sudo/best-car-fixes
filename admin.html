<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<style>
body{margin:0;font:16px/1.6 system-ui,Tahoma,sans-serif;background:#eceff1;color:#1d2733}
header{background:#12263a;color:#fff;padding:12px 4%;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header b{margin-inline-end:auto}
button{background:#e8431a;color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 4%}nav button{background:#fff;color:#12263a;border:1px solid #cfd6dc}nav .on{background:#12263a;color:#fff}
main{padding:0 4% 40px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.box{background:#fff;border:1px solid #d5dbe0;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:#5f6b78}
input,textarea,select{padding:9px;border:1px solid #b8c1ca;border-radius:4px;font:inherit;width:100%;box-sizing:border-box}
.pv{max-height:80px;max-width:140px;object-fit:contain}
.row{display:flex;gap:8px;align-items:center;border-bottom:1px solid #e3e8ec;padding:6px 0;flex-wrap:wrap}.row span{flex:1;min-width:140px}
.row img{height:38px;width:38px;object-fit:cover;border-radius:4px}
.del{background:#a61e1e}.sec{background:#12263a}
#login{max-width:360px;margin:12vh auto;grid-template-columns:1fr}
</style></head>
<body>
<header><b>لوحة التحكم – BESTCAR FIXES</b><button id="out" hidden>تسجيل الخروج</button></header>
<main id="login" class="box"><h3>تسجيل الدخول</h3><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة المرور"><button id="go">دخول</button><small id="err" style="color:#a61e1e"></small></main>
<nav id="tabs" hidden></nav><main id="app" hidden></main>
<datalist id="cats"></datalist>
<script type="module">
import {db,auth} from "./firebase-config.js";
import {collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,orderBy,query} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F={
settings:[["name","اسم الشركة (EN)"],["nameAr","اسم الشركة (AR)"],["desc","وصف الشركة (EN)","t"],["descAr","وصف الشركة (AR)","t"],["logo","الشعار","img"],["heroImage","صورة غلاف الصفحة الرئيسية (عريضة)","img"],["whatsapp","رقم واتساب الرئيسي (بالمفتاح الدولي، أرقام فقط)"],["whatsappOrders","رقم واتساب لطلبات المنتجات وقطع الغيار (اختياري، وإلا يُستخدم الرقم الرئيسي)"],["whatsappBookings","رقم واتساب لطلبات الصيانة والحجز (اختياري، وإلا يُستخدم الرقم الرئيسي)"],["phone","رقم الهاتف"],["email","البريد الإلكتروني"],["address","عنوان الورشة (EN)"],["addressAr","عنوان الورشة (AR)"],["locations","مواقع الورش للحجز (سطر لكل موقع)","t"],["mapUrl","رابط الموقع على الخريطة"],["mapQuery","عنوان أو إحداثيات الخريطة (مثال: 24.47,39.61)"],["facebook","فيسبوك (الرابط أو اسم الصفحة)"],["instagram","انستغرام (الرابط أو اسم الحساب)"],["tiktok","تيك توك (الرابط أو اسم الحساب)"],["youtube","يوتيوب (رابط القناة أو @اسم القناة)"],["twitter","X / تويتر (الرابط أو اسم الحساب)"],["snapchat","سناب شات (الرابط أو اسم الحساب)"]],
banners:[["title","العنوان (EN)"],["titleAr","العنوان (AR)"],["text","النص (EN)"],["textAr","النص (AR)"],["image","الصورة","img"]],
services:[["title","اسم الخدمة (EN)"],["titleAr","اسم الخدمة (AR)"],["desc","الوصف (EN)","t"],["descAr","الوصف (AR)","t"],["image","الصورة","img"]],
products:[["name","اسم المنتج (EN)"],["nameAr","اسم المنتج (AR)"],["price","السعر ($)","n"],["category","التصنيف (نفس اسم التصنيف EN)"],["desc","الوصف (EN)","t"],["descAr","الوصف (AR)","t"],["video","فيديو مرتبط بالمنتج","v"],["image","الصورة","img"]],
categories:[["name","اسم التصنيف (EN)"],["nameAr","اسم التصنيف (AR)"]],
videos:[["title","عنوان الفيديو"],["url","رابط يوتيوب"]]};
const N={settings:"الإعدادات",banners:"العروض",services:"الخدمات",products:"المنتجات",categories:"التصنيفات",videos:"الفيديوهات",orders:"الطلبات",appointments:"المواعيد",partRequests:"طلبات القطع",schedule:"أوقات العمل"};
const DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const ytId=u=>(String(u||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const ytI=r=>{const i=ytId(r.url);return i?`<img src="https://img.youtube.com/vi/${i}/default.jpg">`:""};
const DEF=[["🔍","Car diagnostics","فحص الأعطال بالكمبيوتر"],["⚙️","Engine repair","إصلاح المحركات"],["🔧","Transmission repair","إصلاح ناقل الحركة"],["⚡","Electrical system repair","إصلاح الكهرباء"],["💻","Computer programming","برمجة الكمبيوتر"],["🔑","Key programming","برمجة المفاتيح"],["🛠️","General vehicle maintenance","الصيانة العامة"]];
addEventListener("unhandledrejection",e=>{const c=(e.reason&&e.reason.code)||"";alert(c.includes("permission")?"فشل الحفظ: لا توجد صلاحية. تأكد أن UID حسابك في Authentication مطابق للمكتوب في قواعد Firestore ثم اضغط Publish.":"حدث خطأ: "+(c||e.reason))});
let cur="settings",edit=null,img={},VL=[];
const form=(fs,v={})=>fs.map(([k,l,t])=>`<label>${l}${t=="t"?`<textarea rows=3 data-k="${k}">${esc(v[k])}</textarea>`:t=="v"?`<select data-k="${k}"><option value="">—</option>${VL.map(x=>`<option value="${x.id}" ${x.id==v[k]?"selected":""}>${esc(x.title)}</option>`).join("")}</select>`:t=="img"?`<input type=file accept="image/*" data-f="${k}"><img class=pv id="pv_${k}" src="${v[k]||""}" ${v[k]?"":"hidden"}>`:`<input data-k="${k}" type="${t=="n"?"number":"text"}" step="any" ${k=="category"?'list=cats':""} value="${esc(v[k])}">`}</label>`).join("");
const collect=(fs,old={})=>{const o={};fs.forEach(([k,,t])=>{const e=document.querySelector(`[data-k="${k}"]`);o[k]=t=="img"?(img[k]||old[k]||""):t=="n"?+e.value||0:e.value.trim()});return o};
const toData=(file,max)=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/webp",.8))};i.src=URL.createObjectURL(file)});
document.addEventListener("change",async e=>{const k=e.target.dataset.f;if(!k)return;img[k]=await toData(e.target.files[0],k=="logo"?400:k=="heroImage"?1600:800);const p=$("#pv_"+k);p.src=img[k];p.hidden=false});
const list=async n=>(await getDocs(query(collection(db,n),...(n=="orders"||n=="appointments"||n=="partRequests"?[orderBy("createdAt","desc")]:[])))).docs.map(d=>({id:d.id,...d.data()}));
async function show(){
  $("#tabs").innerHTML=Object.keys(N).map(k=>`<button class="${k==cur?"on":""}" data-t="${k}">${N[k]}</button>`).join("");
  const m=$("#app");img={};
  if(cur=="schedule"){const s=(await getDoc(doc(db,"settings","site"))).data()||{},h=s.hours||{};
    m.innerHTML=`<div class="box">${DN.map((n,i)=>{const x=h[i]||{};return `<div class="row"><b style="width:80px">${n}</b><label style="flex-direction:row;align-items:center;gap:4px"><input type=checkbox id="x${i}" style="width:auto" ${x.x?"checked":""}>مغلق</label><input type=time id="o${i}" value="${x.o||"09:00"}" style="width:120px"><input type=time id="c${i}" value="${x.c||"18:00"}" style="width:120px"></div>`}).join("")}<button id="sv">حفظ أوقات العمل</button></div>`;
    $("#sv").onclick=async()=>{const hours={};DN.forEach((_,i)=>hours[i]={x:$("#x"+i).checked,o:$("#o"+i).value,c:$("#c"+i).value});await setDoc(doc(db,"settings","site"),{hours},{merge:true});alert("تم الحفظ")};return}
  if(cur=="settings"){const s=(await getDoc(doc(db,"settings","site"))).data()||{};
    m.innerHTML=`<div class="box">${form(F.settings,s)}<button id="sv">حفظ الإعدادات</button></div>`;
    $("#sv").onclick=async()=>{await setDoc(doc(db,"settings","site"),collect(F.settings,s),{merge:true});alert("تم الحفظ")};return}
  const rows=await list(cur);
  if(cur=="orders"||cur=="appointments"||cur=="partRequests"){
    m.innerHTML=`<div class="box" style="grid-column:1/-1"><h3>${N[cur]} (${rows.length})</h3>${rows.map(r=>`<div class="row"><span><b>${esc(r.name)}</b> – ${esc(r.phone)}<br>${cur=="orders"?r.items.map(i=>esc(i.name)+" ×"+i.qty).join("، ")+" | $"+Number(r.total).toFixed(2)+"<br>"+esc(r.address):cur=="partRequests"?esc(r.car)+" ("+esc(r.year)+")<br>"+esc(r.part)+(r.image?`<br><img src="${r.image}" style="height:auto;width:auto;max-height:120px">`:""):esc(r.car)+" ("+esc(r.year)+") – "+esc(r.service)+"<br>"+esc(r.date)+" | "+esc(r.location)+"<br>"+esc(r.notes)}</span><select data-s="${r.id}"><option value=new ${r.status=="new"?"selected":""}>جديد</option><option value=done ${r.status=="done"?"selected":""}>تم</option></select><button class="del" data-d="${r.id}">حذف</button></div>`).join("")}</div>`;return}
  if(cur=="products")VL=await list("videos");
  if(cur=="products")$("#cats").innerHTML=(await list("categories")).map(c=>`<option value="${esc(c.name)}">`).join("");
  const cur_=rows.find(r=>r.id==edit)||{},lab=r=>r.title||r.name||r.url;
  m.innerHTML=`<div class="box"><h3>${edit?"تعديل":"إضافة"}</h3>${form(F[cur],cur_)}<button id="sv">حفظ</button>${edit?'<button class="sec" id="cn">إلغاء</button>':""}</div>
  <div class="box"><h3>${N[cur]} (${rows.length})</h3>${cur=="services"&&!rows.length?'<button class="sec" id="seed">إضافة الخدمات الافتراضية</button>':""}${rows.map(r=>`<div class="row">${r.image?`<img src="${r.image}">`:ytI(r)}<span>${esc(lab(r))}${r.price!==undefined?" – $"+r.price:""}</span><button class="sec" data-e="${r.id}">تعديل</button><button class="del" data-d="${r.id}">حذف</button></div>`).join("")}</div>`;
  $("#sv").onclick=async()=>{const d={...collect(F[cur],cur_)};if(cur=="videos"&&!ytId(d.url))return alert("رابط يوتيوب غير صحيح");edit?await updateDoc(doc(db,cur,edit),d):await addDoc(collection(db,cur),d);edit=null;alert("تم الحفظ ✓");show()};
  if($("#cn"))$("#cn").onclick=()=>{edit=null;show()};
  if($("#seed"))$("#seed").onclick=async()=>{for(const s of DEF)await addDoc(collection(db,"services"),{icon:s[0],title:s[1],titleAr:s[2],desc:"",descAr:"",image:""});show()};
}
document.addEventListener("click",async e=>{const d=e.target.dataset||{};
  if(d.t){cur=d.t;edit=null;show()}
  if(d.e){edit=d.e;show();scrollTo(0,0)}
  if(d.d&&confirm("هل أنت متأكد من الحذف؟")){await deleteDoc(doc(db,cur,d.d));show()}});
document.addEventListener("change",async e=>{if(e.target.dataset.s)await updateDoc(doc(db,cur,e.target.dataset.s),{status:e.target.value})});
$("#go").onclick=()=>signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).catch(e=>{const c=e.code||"";$("#err").textContent=/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?"البريد أو كلمة المرور غير صحيحة، أو لا يوجد مستخدم بهذا البريد":c.includes("operation-not-allowed")?"طريقة Email/Password غير مفعّلة في Firebase":c.includes("unauthorized-domain")?"النطاق غير مضاف في Authorized domains":c.includes("api-key")?"مفتاح Firebase في firebase-config.js غير صحيح":"تعذر الدخول: "+c});
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{["#login"].forEach(s=>$(s).hidden=!!u);["#tabs","#app","#out"].forEach(s=>$(s).hidden=!u);if(u){$("header b").textContent="لوحة التحكم | "+u.email+" | UID: "+u.uid;show()}});
</script></body></html>
